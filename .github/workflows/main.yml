name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '22', '24', '26']
    name: test (node ${{ matrix.node }})
    env:
      ENABLE_INTEGRATION_TESTS: '1'
      SANITY_TEST_PROJECT_ID: ${{ vars.SANITY_TEST_PROJECT_ID }}
      SANITY_TEST_DATASET: ${{ vars.SANITY_TEST_DATASET }}
      SANITY_TEST_TOKEN: ${{ secrets.SANITY_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Build and release tooling requires a newer Node than the library itself.
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test
      - name: Verify ESM package entry point
        run: node --input-type=module -e "import assert from 'node:assert/strict'; import {diffPatch} from '@sanity/diff-patch'; assert.deepEqual(diffPatch({_id:'test',count:1},{_id:'test',count:2}),[{patch:{id:'test',set:{count:2}}}])"

  release:
    needs: [test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.ECOSPARK_CLIENT_ID }}
          private-key: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
